<svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vision Owl (Athena) - Iconic Learning & Visual AI Mascot -->
  <defs>
    <linearGradient id="owlBg" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="owlGlow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#owlBg)" stroke="url(#owlGlow)" stroke-width="3.5"/>

  <!-- Owl Feather Crest / Ears -->
  <path d="M34 32 L46 44 L30 46 Z" fill="#6366f1"/>
  <path d="M86 32 L90 46 L74 44 Z" fill="#6366f1"/>

  <!-- Head & Body Silhouette -->
  <path d="M36 44 C36 36 84 36 84 44 C88 56 88 84 80 94 C72 102 48 102 40 94 C32 84 32 56 36 44 Z" fill="#f8fafc"/>

  <!-- Dual Visual Aperture Eyes (Camera Lenses / Vision AI) -->
  <circle cx="48" cy="58" r="14" fill="#0f172a" stroke="url(#lensGrad)" stroke-width="2.5"/>
  <circle cx="72" cy="58" r="14" fill="#0f172a" stroke="url(#lensGrad)" stroke-width="2.5"/>
  
  <!-- Glowing Lens Core -->
  <circle cx="48" cy="58" r="7" fill="url(#lensGrad)"/>
  <circle cx="72" cy="58" r="7" fill="url(#lensGrad)"/>
  <circle cx="50" cy="56" r="2.5" fill="#ffffff"/>
  <circle cx="74" cy="56" r="2.5" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="60,65 56,74 64,74" fill="#f59e0b"/>

  <!-- Chest Visual Chevron -->
  <path d="M50 82 L60 90 L70 82" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
