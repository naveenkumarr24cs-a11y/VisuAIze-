<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Flat 2D Monkey Vector (Transparent Background) -->
  <g fill="#ffffff">
    <!-- Curving S-Tail (Graceful upwards sweep) -->
    <path d="M60 76 C76 76 90 62 90 40 C90 16 74 8 66 10 C62 12 60 16 62 20 C64 24 70 22 72 20 C78 18 82 22 82 36 C82 52 70 66 56 66" 
          stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Main Body & Haunches -->
    <path d="M28 80 C22 66 26 50 36 42 C42 36 52 36 58 42 C66 50 72 64 66 80 C62 88 54 90 44 90 C32 90 28 84 28 80 Z"/>

    <!-- Front Leg & Paw -->
    <path d="M30 58 C28 66 22 78 18 84 C16 88 24 90 30 90 C36 90 40 80 42 68 Z"/>

    <!-- Head -->
    <circle cx="40" cy="34" r="17"/>

    <!-- Left & Right Ears -->
    <circle cx="22" cy="32" r="7"/>
    <circle cx="58" cy="32" r="7"/>
  </g>

  <!-- Inner Ear Cutouts -->
  <circle cx="22" cy="32" r="4" fill="#131316"/>
  <circle cx="58" cy="32" r="4" fill="#131316"/>

  <!-- Face Mask (Negative space) -->
  <ellipse cx="40" cy="35" rx="11" ry="10" fill="#131316"/>

  <!-- Eyes, Nose, Smile (White on dark mask) -->
  <circle cx="36" cy="33" r="2.2" fill="#ffffff"/>
  <circle cx="44" cy="33" r="2.2" fill="#ffffff"/>
  <ellipse cx="40" cy="38" rx="2" ry="1.4" fill="#ffffff"/>
  <path d="M37 41 C39 42.5 41 42.5 43 41" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
