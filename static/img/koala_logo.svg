<svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circular Badge -->
  <circle cx="50" cy="50" r="48" fill="#1e1e24" stroke="url(#koalaStroke)" stroke-width="3"/>
  
  <!-- Eucalyptus Branch & Leaves -->
  <path d="M12 52C22 50 32 44 38 34" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M14 42C10 38 10 30 16 30C22 30 20 40 14 42Z" fill="#22c55e" opacity="0.85"/>
  <path d="M10 58C6 62 8 70 14 68C20 66 18 56 10 58Z" fill="#22c55e" opacity="0.85"/>
  
  <path d="M88 48C74 52 64 62 60 76" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M84 38C88 34 94 36 92 42C90 48 82 44 84 38Z" fill="#22c55e" opacity="0.85"/>
  <path d="M86 58C90 62 88 70 82 68C76 66 80 56 86 58Z" fill="#22c55e" opacity="0.85"/>
  <path d="M68 76C64 80 66 88 72 86C78 84 74 74 68 76Z" fill="#22c55e" opacity="0.85"/>

  <!-- Koala Silhouette Body -->
  <g fill="url(#koalaBodyGrad)">
    <!-- Left Ear -->
    <circle cx="34" cy="34" r="14"/>
    <!-- Right Ear -->
    <circle cx="66" cy="34" r="14"/>
    
    <!-- Head -->
    <ellipse cx="50" cy="42" rx="19" ry="16"/>
    
    <!-- Back & Body -->
    <path d="M36 46C28 54 26 72 38 82C48 90 62 88 64 82C66 74 58 68 56 62C54 56 58 50 56 46Z"/>
    
    <!-- Arm Clinging to Branch -->
    <path d="M52 56C58 56 68 52 74 46C78 42 74 38 68 42C62 46 56 50 50 52Z"/>
    
    <!-- Leg / Foot -->
    <ellipse cx="46" cy="80" rx="9" ry="7"/>
  </g>

  <!-- Inner Ear Soft Accents -->
  <circle cx="34" cy="34" r="8" fill="#1e1e24" opacity="0.6"/>
  <circle cx="66" cy="34" r="8" fill="#1e1e24" opacity="0.6"/>

  <!-- Koala Eyes -->
  <circle cx="43" cy="40" r="2.8" fill="#131316"/>
  <circle cx="57" cy="40" r="2.8" fill="#131316"/>
  <circle cx="44" cy="39" r="0.9" fill="#ffffff"/>
  <circle cx="58" cy="39" r="0.9" fill="#ffffff"/>

  <!-- Big Iconic Oval Koala Nose -->
  <ellipse cx="50" cy="45" rx="5.5" ry="7.5" fill="#131316"/>
  <ellipse cx="48.5" cy="43.5" rx="1.8" ry="2.2" fill="#ffffff" opacity="0.25"/>

  <!-- Cute Cheeks -->
  <circle cx="38" cy="46" r="2.5" fill="#f43f5e" opacity="0.3"/>
  <circle cx="62" cy="46" r="2.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="koalaStroke" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#da7756"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="koalaBodyGrad" x1="30" y1="20" x2="70" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
</svg>
