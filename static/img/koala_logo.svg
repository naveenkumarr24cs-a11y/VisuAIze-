<svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Geometric Koala Badge (GitHub/Ollama Style) -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    
    <!-- Neon Accent Glow -->
    <linearGradient id="glowRing" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#da7756"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Koala Body Tone -->
    <linearGradient id="koalaFur" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring with Ambient Shadow -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="3.5" filter="url(#subtleGlow)"/>

  <!-- Botanical Bamboo/Eucalyptus Leaf Accents (Geometric Minimalist) -->
  <path d="M18 64 C26 56 34 52 42 46 C38 58 32 68 22 72 Z" fill="#22c55e" opacity="0.9"/>
  <path d="M98 48 C92 58 86 64 78 68 C82 56 88 48 98 44 Z" fill="#22c55e" opacity="0.9"/>

  <!-- Koala Ears (Fluffy Silhouette) -->
  <g fill="url(#koalaFur)">
    <!-- Left Ear -->
    <circle cx="36" cy="38" r="17"/>
    <!-- Right Ear -->
    <circle cx="84" cy="38" r="17"/>
  </g>
  
  <!-- Ear Inner Shadows -->
  <circle cx="36" cy="38" r="10" fill="#334155" opacity="0.85"/>
  <circle cx="84" cy="38" r="10" fill="#334155" opacity="0.85"/>

  <!-- Koala Head Silhouette (Clean Rounded Geometry) -->
  <ellipse cx="60" cy="54" rx="28" ry="24" fill="url(#koalaFur)"/>

  <!-- Koala Body Clinging Posture -->
  <path d="M42 66 C36 74 34 88 46 98 C58 104 74 102 78 94 C82 86 78 78 74 72 C68 66 52 64 42 66 Z" fill="url(#koalaFur)"/>

  <!-- Cute Koala Paws -->
  <circle cx="44" cy="74" r="6" fill="#cbd5e1"/>
  <circle cx="76" cy="74" r="6" fill="#cbd5e1"/>

  <!-- Koala Eyes (Curious & Friendly) -->
  <ellipse cx="49" cy="50" rx="3.5" ry="4.5" fill="#0f172a"/>
  <ellipse cx="71" cy="50" rx="3.5" ry="4.5" fill="#0f172a"/>
  <circle cx="50" cy="48.5" r="1.5" fill="#ffffff"/>
  <circle cx="72" cy="48.5" r="1.5" fill="#ffffff"/>

  <!-- Big Iconic Matte Koala Nose (Signature Feature) -->
  <path d="M55 48 C55 44 65 44 65 48 C66 56 66 64 60 67 C54 64 54 56 55 48 Z" fill="#0f172a"/>
  <ellipse cx="58" cy="51" rx="2" ry="3" fill="#334155" opacity="0.6"/>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="40" cy="56" rx="4" ry="2.5" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="80" cy="56" rx="4" ry="2.5" fill="#f43f5e" opacity="0.35"/>
</svg>
