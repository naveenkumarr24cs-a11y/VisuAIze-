<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Monkey Badge (GitHub/Ollama Flat Silhouette Style) -->
  <defs>
    <!-- Background Circle Fill -->
    <linearGradient id="monkeyBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>

    <!-- Vibrant Gradient Ring -->
    <linearGradient id="monkeyRing" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#da7756"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Monkey Silhouette Gradient -->
    <linearGradient id="monkeyBody" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#monkeyBg)" stroke="url(#monkeyRing)" stroke-width="3"/>

  <!-- Sitting Monkey Group (Centered) -->
  <g transform="translate(15, 12) scale(0.72)">
    <!-- Curving S-Tail (Graceful upwards sweep) -->
    <path d="M52 64 C64 64 74 54 74 36 C74 16 62 10 56 12 C52 14 50 18 52 22 C54 25 58 24 60 22 C64 20 68 24 68 34 C68 46 58 54 48 54" 
          stroke="url(#monkeyBody)" stroke-width="5.5" stroke-linecap="round" fill="none"/>

    <!-- Monkey Main Body (Sitting haunches & back) -->
    <path d="M26 68 C22 56 24 44 32 38 C36 34 44 34 48 38 C54 44 58 54 54 68 C52 74 46 76 38 76 C28 76 26 72 26 68 Z" 
          fill="url(#monkeyBody)"/>

    <!-- Front Leg & Paw -->
    <path d="M28 50 C26 56 22 66 18 72 C16 75 22 76 26 76 C30 76 34 68 36 58 Z" 
          fill="url(#monkeyBody)"/>

    <!-- Hind Leg & Thigh Curve -->
    <path d="M42 56 C48 60 52 66 50 74 C48 76 40 76 36 76 C42 70 44 62 42 56 Z" 
          fill="url(#monkeyBody)"/>

    <!-- Monkey Head -->
    <circle cx="34" cy="30" r="14" fill="url(#monkeyBody)"/>

    <!-- Left & Right Ears -->
    <circle cx="20" cy="28" r="5.5" fill="url(#monkeyBody)"/>
    <circle cx="48" cy="28" r="5.5" fill="url(#monkeyBody)"/>
    <circle cx="20" cy="28" r="3" fill="#1e1e24"/>
    <circle cx="48" cy="28" r="3" fill="#1e1e24"/>

    <!-- Face Mask (Negative space) -->
    <ellipse cx="34" cy="31" rx="9" ry="8" fill="#1e1e24"/>

    <!-- Cute Eyes -->
    <circle cx="30.5" cy="29.5" r="1.8" fill="#ffffff"/>
    <circle cx="37.5" cy="29.5" r="1.8" fill="#ffffff"/>

    <!-- Cute Nose & Smile -->
    <ellipse cx="34" cy="33.5" rx="1.5" ry="1.1" fill="#ffffff"/>
    <path d="M31.5 35.5 C33 37 35 37 36.5 35.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
